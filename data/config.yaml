llm:
  apiKey: "your-api-key"
  baseUrl: "https://your-llmbase-rl"
  modelName: "qwen-max"
  temperature: 0.7
  maxOutputTokens: 1000
  logRequests: false
  timeout: 60000

prompts:
  memory_coverage: |
    # 记忆覆盖判断任务
    
    ## 任务目标
    判断预期记忆和实际记忆之间的语义覆盖关系，用于计算记忆提取的精准度和完整度。
    
    ## 判断标准
    
    ### 覆盖关系定义
    - **完全覆盖**: 两条记忆的核心语义完全一致，表述可能不同但信息等价
    - **部分覆盖**: 两条记忆有重叠信息，但不完全等价
    - **不覆盖**: 两条记忆语义完全不同，没有信息重叠
    
    ### 判断原则
    1. **语义优先**: 关注语义内容，不拘泥于表述形式
    2. **核心信息**: 判断核心信息点是否一致
    3. **信息完整性**: 考虑信息的完整程度
    4. **上下文理解**: 结合记忆的使用场景理解
    
    ### 示例说明
    
    **示例1 - 完全覆盖**
    - 预期: "用户叫张三"
    - 实际: "用户的名字是张三"
    - 判断: ✅ 完全覆盖（核心信息一致）
    
    **示例2 - 部分覆盖**
    - 预期: "用户叫张三，今年25岁"
    - 实际: "用户叫张三"
    - 判断: ⚠️ 部分覆盖（缺少年龄信息）
    
    **示例3 - 不覆盖**
    - 预期: "用户喜欢打篮球"
    - 实际: "用户住在北京"
    - 判断: ❌ 不覆盖（完全不同的信息）
    
    ## 输入信息
    
    **预期记忆列表**:
    {{expected_memories}}
    
    **实际记忆列表**:
    {{actual_memories}}
    
    ## 输出要求
    
    请严格按照以下JSON格式输出，为每条实际记忆找到最匹配的预期记忆索引（如果存在），并提供详细的匹配说明：
    
    ```json
    {
      "memory_matching_map": {
        "0": 0,
        "1": -1,
        "2": 1
      },
      "matching_details": [
        {
          "actual_index": 0,
          "actual_content": "实际记忆内容",
          "expected_index": 0,
          "expected_content": "预期记忆内容",
          "match_reason": "匹配原因说明"
        },
        {
          "actual_index": 1,
          "actual_content": "实际记忆内容",
          "expected_index": -1,
          "expected_content": null,
          "match_reason": "未匹配原因说明"
        }
      ]
    }
    ```
    
    ### 字段说明
    - **memory_matching_map**: 对象，快速查找匹配关系
      - **键**: 实际记忆的索引（字符串格式，从"0"开始）
      - **值**: 匹配的预期记忆索引（整数）
        - 如果找到匹配的预期记忆，填写其索引（0, 1, 2...）
        - 如果没有匹配的预期记忆，填写 -1
    - **matching_details**: 数组，每条实际记忆的详细匹配信息
      - **actual_index**: 实际记忆索引
      - **actual_content**: 实际记忆内容
      - **expected_index**: 匹配的预期记忆索引（-1表示未匹配）
      - **expected_content**: 预期记忆内容（未匹配时为null）
      - **match_reason**: 详细说明为什么匹配或不匹配
    
    ### 输出示例
    
    假设有3条实际记忆和2条预期记忆：
    - 实际记忆[0] 匹配 预期记忆[0] → "0": 0
    - 实际记忆[1] 没有匹配 → "1": -1
    - 实际记忆[2] 匹配 预期记忆[1] → "2": 1
    
    输出:
    ```json
    {
      "memory_matching_map": {
        "0": 0,
        "1": -1,
        "2": 1
      }
    }
    ```
    
    ## 注意事项
    1. 每条实际记忆最多匹配一条预期记忆
    2. 优先选择语义最接近的预期记忆
    3. 只有在语义基本一致时才判定为匹配
    4. 索引从0开始计数
    5. 必须为每条实际记忆都提供判断结果

  memory_verbosity: |
    ## 记忆冗长度判断任务
    ### 任务说明
    请判断召回记忆相对于预期记忆是否过于冗长。
    
    ### 输入信息
    **召回记忆**：{{recalled_memory}}
    **预期记忆**：{{expected_memory}}
    
    ### 输出要求
    ```json
    {
      "verbose": true/false,
      "reason": "..."
    }
    ```

  memory_duplication_detection: |
    # 记忆重复检测任务
    
    ## 任务目标
    检测记忆列表中是否存在语义重复的记忆条目，判断记忆系统是否产生了冗余信息。
    
    ## 判断标准
    
    ### 重复定义
    - **完全重复**: 两条记忆表达完全相同的信息，只是措辞略有不同
    - **高度重复**: 两条记忆的核心信息高度重叠（>80%）
    - **部分重复**: 两条记忆有部分信息重叠，但各有独特内容
    - **不重复**: 两条记忆表达不同的信息点
    
    ### 判断原则
    1. **语义层面**: 关注信息内容而非表述形式
    2. **信息粒度**: 考虑信息的详细程度
    3. **独立性**: 判断每条记忆是否有独特价值
    4. **容忍度**: 允许合理的信息补充，不视为重复
    
    ### 示例说明
    
    **示例1 - 存在重复**
    记忆列表:
    1. "用户喜欢打篮球"
    2. "用户爱好是篮球"
    3. "用户住在北京"
    
    判断: ✅ 存在重复（记忆1和2语义重复）
    重复对: [[0, 1]]
    
    **示例2 - 不存在重复**
    记忆列表:
    1. "用户喜欢打篮球"
    2. "用户每周打篮球3次"
    3. "用户住在北京"
    
    判断: ❌ 不存在重复（记忆1和2虽相关但不重复，2提供了额外的频率信息）
    
    **示例3 - 边界情况**
    记忆列表:
    1. "用户叫张三"
    2. "用户叫张三，今年25岁"
    
    判断: ⚠️ 不视为重复（记忆2包含额外的年龄信息，有独立价值）
    
    ## 输入信息
    
    **记忆列表**:
    {{memories}}
    
    ## 输出要求
    
    请严格按照以下JSON格式输出：
    
    ```json
    {
      "has_duplication": true,
      "duplication_pairs": [[0, 1], [2, 3]],
      "duplication_details": [
        {
          "pair": [0, 1],
          "memory1_content": "记忆0的内容",
          "memory2_content": "记忆1的内容",
          "reason": "为什么这两条记忆重复的详细说明"
        }
      ],
      "analysis": "记忆0和记忆1都表达了用户喜欢篮球这一信息，存在语义重复。记忆2和记忆3..."
    }
    ```
    
    ### 字段说明
    - **has_duplication**: 布尔值，是否存在重复
    - **duplication_pairs**: 数组，重复记忆的索引对列表
      - 每对是一个包含两个索引的数组 [index1, index2]
      - 如果没有重复，返回空数组 []
    - **duplication_details**: 数组，每对重复记忆的详细信息
      - **pair**: 重复对的索引 [index1, index2]
      - **memory1_content**: 第一条记忆的内容
      - **memory2_content**: 第二条记忆的内容
      - **reason**: 详细说明为什么这两条记忆重复
    - **analysis**: 字符串，整体的分析说明
    
    ### 输出示例
    
    **无重复情况**:
    ```json
    {
      "has_duplication": false,
      "duplication_pairs": [],
      "analysis": "所有记忆都表达了不同的信息点，没有发现语义重复。"
    }
    ```
    
    **有重复情况**:
    ```json
    {
      "has_duplication": true,
      "duplication_pairs": [[0, 2], [1, 3]],
      "analysis": "记忆0和记忆2都表达了用户的居住地信息，存在重复。记忆1和记忆3都提到了用户的爱好，也存在重复。"
    }
    ```
    
    ## 注意事项
    1. 只标记明显的语义重复，不要过于严格
    2. 信息补充和细化不视为重复
    3. 相关但不同的信息点不视为重复
    4. 索引从0开始计数
    5. 每对重复只需要标记一次

  memory_conflict_detection: |
    # 记忆冲突检测任务
    
    ## 任务目标
    检测记忆列表中是否存在相互矛盾或冲突的记忆条目，判断记忆系统是否产生了不一致的信息。
    
    ## 判断标准
    
    ### 冲突定义
    - **直接冲突**: 两条记忆对同一事实给出了相反或矛盾的描述
    - **时间冲突**: 两条记忆在时间维度上存在逻辑矛盾
    - **逻辑冲突**: 两条记忆在逻辑上无法同时成立
    - **不冲突**: 两条记忆可以和谐共存，没有矛盾
    
    ### 判断原则
    1. **事实层面**: 关注客观事实的一致性
    2. **时间维度**: 考虑信息的时效性和更新
    3. **逻辑推理**: 判断信息之间的逻辑关系
    4. **容忍度**: 信息补充和细化不视为冲突
    
    ### 示例说明
    
    **示例1 - 存在冲突**
    记忆列表:
    1. "用户喜欢打篮球"
    2. "用户不喜欢运动"
    3. "用户住在北京"
    
    判断: ✅ 存在冲突（记忆1和2矛盾）
    冲突对: [[0, 1]]
    原因: 篮球是一种运动，记忆1说喜欢打篮球，记忆2说不喜欢运动，两者矛盾
    
    **示例2 - 存在时间冲突**
    记忆列表:
    1. "用户今年25岁"
    2. "用户今年30岁"
    3. "用户住在北京"
    
    判断: ✅ 存在冲突（记忆1和2对年龄的描述矛盾）
    冲突对: [[0, 1]]
    
    **示例3 - 不存在冲突**
    记忆列表:
    1. "用户喜欢打篮球"
    2. "用户不喜欢踢足球"
    3. "用户住在北京"
    
    判断: ❌ 不存在冲突（喜欢篮球和不喜欢足球可以同时成立）
    
    **示例4 - 边界情况（信息更新）**
    记忆列表:
    1. "用户住在上海"
    2. "用户搬到了北京"
    
    判断: ⚠️ 不视为冲突（这是信息的时间演变，不是矛盾）
    
    ## 输入信息
    
    **记忆列表**:
    {{memories}}
    
    ## 输出要求
    
    请严格按照以下JSON格式输出：
    
    ```json
    {
      "has_conflict": true,
      "conflict_pairs": [[0, 1], [2, 3]],
      "conflict_details": [
        {
          "pair": [0, 1],
          "memory1_content": "记忆0的内容",
          "memory2_content": "记忆1的内容",
          "reason": "为什么这两条记忆冲突的详细说明"
        }
      ],
      "analysis": "记忆0说用户喜欢打篮球，但记忆1说用户不喜欢运动，两者存在逻辑矛盾..."
    }
    ```
    
    ### 字段说明
    - **has_conflict**: 布尔值，是否存在冲突
    - **conflict_pairs**: 数组，冲突记忆的索引对列表
      - 每对是一个包含两个索引的数组 [index1, index2]
      - 如果没有冲突，返回空数组 []
    - **conflict_details**: 数组，每对冲突记忆的详细信息
      - **pair**: 冲突对的索引 [index1, index2]
      - **memory1_content**: 第一条记忆的内容
      - **memory2_content**: 第二条记忆的内容
      - **reason**: 详细说明为什么这两条记忆冲突
    - **analysis**: 字符串，整体的冲突分析说明
    
    ### 输出示例
    
    **无冲突情况**:
    ```json
    {
      "has_conflict": false,
      "conflict_pairs": [],
      "analysis": "所有记忆在逻辑上都是一致的，没有发现矛盾或冲突。"
    }
    ```
    
    **有冲突情况**:
    ```json
    {
      "has_conflict": true,
      "conflict_pairs": [[0, 2]],
      "analysis": "记忆0说用户25岁，记忆2说用户30岁，对同一事实给出了不同的描述，存在冲突。"
    }
    ```
    
    ## 注意事项
    1. 只标记明显的逻辑矛盾，不要过于严格
    2. 信息的时间演变不视为冲突
    3. 不同维度的信息不视为冲突
    4. 索引从0开始计数
    5. 每对冲突只需要标记一次
    6. 区分"不同"和"矛盾"：不同的信息不一定矛盾

  memory_granularity: |
    ## 记忆提取粒度检测任务
    ### 任务说明
    请分析每条记忆的信息粒度，判断是单粒度还是多粒度。
    
    ### 输入信息
    **查询问题**：{{query}}
    **标准答案**：{{answer}}
    **实际记忆列表**（共{{actual_count}}条）：
    {{actual_memories}}
    
    ### 输出要求
    ```json
    {
      "granularity_results": [
        {
          "memory_index": 0,
          "is_single_granularity": true/false,
          "analysis": "..."
        }
      ]
    }
    ```
